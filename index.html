<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八股笔记 · Java 后端 + AI Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E八%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=ab30056e">
<script>
  (function () {
    var t = localStorage.getItem('iv.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body data-part="home">
<header class="site-header">
  <a href="index.html" class="brand"><span class="dot">●</span> 八股笔记</a>
  <nav class="tabs" id="tabs"></nav>
  <button class="icon-btn" id="theme-toggle" aria-label="切换主题">◐</button>
</header>
<div class="home">
  <h1>Java 后端 + AI Agent 八股</h1>
  <p class="lead" id="lead">每个章节一页,按子分组从上往下读。</p>
  <a id="resume" class="home-resume" hidden></a>
  <div id="parts"></div>
  <div class="note">
    <p><i class="t-core" style="font-style:normal;font-size:12px;padding:1px 6px;border-radius:4px">高频</i> 高频考点 ·
      <i class="t-co bank" style="font-style:normal;font-size:12px;padding:1px 6px;border-radius:4px">工商银行</i> 出过这道题的公司</p>
    <p>建议顺序:先过一遍「114 道真题」摸清考点,再按章节打开「只看高频」通读,最后用「自测模式」逐题回忆、对照答案。</p>
    <p>快捷键:<b>/</b> 搜索全站题目 · <b>j</b>/<b>k</b> 上下题 · 自测时 <b>空格</b> 展开答案。阅读位置会自动记住。</p>
  </div>
</div>
<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t); localStorage.setItem('iv.theme', t);
  });
  fetch('data/nav.json').then(function (r) { return r.json(); }).then(function (nav) {
    document.getElementById('tabs').innerHTML = nav.parts.map(function (p) { return '<a href="' + p.sections[0].id + '.html">' + p.title + '</a>'; }).join('');
    document.getElementById('lead').textContent = '共 ' + nav.total + ' 道题(其中高频 ' + nav.core + ' 道),每个章节一页,按子分组从上往下读。';
    try {
      var last = JSON.parse(localStorage.getItem('iv.last'));
      if (last) { var r = document.getElementById('resume'); r.hidden = false; r.href = last.sec + '.html#' + last.id; r.innerHTML = '<small>继续上次 · ' + last.secTitle + '</small>' + last.title.replace(/</g, '&lt;'); }
    } catch (e) {}
    document.getElementById('parts').innerHTML = nav.parts.map(function (p) {
      return '<div class="home-part"><h2><a href="' + p.sections[0].id + '.html">' + p.title + ' →</a></h2><div class="secs">' +
        p.sections.map(function (s) { return '<a href="' + s.id + '.html">' + s.title + '<span>' + s.n + '</span></a>'; }).join('') + '</div></div>';
    }).join('');
  });
</script>
</body>
</html>
