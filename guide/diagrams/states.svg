<svg class="dg" viewBox="0 0 740 300" role="img" aria-label="Run 状态机:queued、running、waiting_approval、succeeded、failed、cancelled 之间的转换">
  <defs><marker id="ah-st" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahp" d="M0,0 L8,4 L0,8 z"/></marker></defs>

  <rect class="bx" x="30" y="60" width="130" height="44" rx="22"/>
  <text class="h" x="95" y="87">queued</text>
  <rect class="bx ac" x="260" y="60" width="130" height="44" rx="22"/>
  <text class="h" x="325" y="87">running</text>
  <rect class="bx" x="235" y="210" width="180" height="44" rx="22"/>
  <text class="h" x="325" y="237">waiting_approval</text>
  <rect class="bx ok" x="560" y="8" width="150" height="40" rx="20"/>
  <text class="h" x="635" y="33">succeeded</text>
  <rect class="bx bad" x="560" y="62" width="150" height="40" rx="20"/>
  <text class="h" x="635" y="87">failed</text>
  <rect class="bx" x="560" y="212" width="150" height="40" rx="20"/>
  <text class="h" x="635" y="237">cancelled</text>

  <path class="ln" d="M160,82 H258" marker-end="url(#ah-st)"/>
  <text class="s" x="210" y="74">Worker 领取</text>
  <path class="ln ds" d="M300,60 Q215,0 130,58" marker-end="url(#ah-st)"/>
  <text class="s" x="215" y="22">租约过期 / 可重试失败</text>
  <path class="ln" d="M390,72 L558,30" marker-end="url(#ah-st)"/>
  <text class="s" x="470" y="40">完成</text>
  <path class="ln" d="M390,84 H558" marker-end="url(#ah-st)"/>
  <text class="s" x="476" y="78">不可重试 / 重试耗尽</text>
  <path class="ln" d="M390,98 L558,224" marker-end="url(#ah-st)"/>
  <text class="s" x="505" y="150">用户停止</text>
  <path class="ln" d="M305,104 V208" marker-end="url(#ah-st)"/>
  <text class="s e" x="297" y="160">高危工具需审批</text>
  <path class="ln" d="M345,210 V106" marker-end="url(#ah-st)"/>
  <text class="s st" x="353" y="160">批准</text>
  <path class="ln" d="M415,232 H558" marker-end="url(#ah-st)"/>
  <text class="s" x="486" y="225">拒绝 / 审批超时</text>
  <path class="ln" d="M95,104 V280 H635 V254" marker-end="url(#ah-st)"/>
  <text class="s" x="200" y="274">排队中被取消</text>
</svg>
